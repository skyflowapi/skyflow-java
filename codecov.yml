# Kept deliberately small, like the node / python / go SDK repos: Codecov posts two checks per
# commit (project + patch). The earlier per-flag statuses and 16 components made it 21 check
# runs per commit, and Codecov's check-run posting intermittently left some of them stuck
# "in progress". The per-module breakdown is still visible in the PR comment below and on the
# Codecov dashboard via the flags; it just no longer gets a GitHub check of its own.

# Post a summary on every PR, broken down by flag (module) so all three of
# common / skyvault / flowvault are visible at a glance. require_changes: false keeps the
# comment on PRs that touch only one module, so the other two still report their coverage.
comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

# One flag per Maven module. Each module is uploaded separately in CI so its coverage is
# reported on its own rather than merged into a single repo-wide number. carryforward keeps
# the last known coverage for a module when a run does not upload it (e.g. a partial build).
flags:
  common:
    paths:
      - common/src/main/java/
    carryforward: true
  skyvault:
    paths:
      - skyvault/src/main/java/
    carryforward: true
  flowvault:
    paths:
      - flowvault/src/main/java/
    carryforward: true

# Generated REST/auth clients and sample code are not hand-written and are already excluded
# from the JaCoCo reports by the root pom; ignore them here too so they never skew a target.
ignore:
  - "**/src/main/java/com/skyflow/generated/**"
  - "**/samples/**"
  - "**/src/test/**"
