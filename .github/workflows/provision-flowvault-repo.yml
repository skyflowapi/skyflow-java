name: Provision flowvault Artifactory repo (one-off test)

# Manual-only: tests whether the existing ARTIFACTORY_USERNAME/PASSWORD deploy
# credential also has enough Artifactory permission to create a new repository.
# JFrog's repo-config API normally requires an admin user, so a deploy-scoped
# service account is expected to fail here with 401/403 - that's a useful,
# non-destructive answer either way. Delete this workflow once the question
# is settled (either the repo gets created, or an admin creates it manually).

on:
  workflow_dispatch:

jobs:
  create-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Check if repo already exists
        id: check
        run: |
          status=$(curl -s -o /tmp/check.json -w "%{http_code}" \
            -u "${{ secrets.ARTIFACTORY_USERNAME }}:${{ secrets.ARTIFACTORY_PASSWORD }}" \
            "https://prekarilabs.jfrog.io/artifactory/api/repositories/skyflow-flowvault-java")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "--- response body ---"
          cat /tmp/check.json

      - name: Create repo if missing (local Maven repo, releases+snapshots combined, mirrors skyflow-java)
        if: steps.check.outputs.status == '404'
        run: |
          status=$(curl -s -o /tmp/create.json -w "%{http_code}" -X PUT \
            -u "${{ secrets.ARTIFACTORY_USERNAME }}:${{ secrets.ARTIFACTORY_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "key": "skyflow-flowvault-java",
                  "rclass": "local",
                  "packageType": "maven",
                  "handleReleases": true,
                  "handleSnapshots": true,
                  "snapshotVersionBehavior": "unique"
                }' \
            "https://prekarilabs.jfrog.io/artifactory/api/repositories/skyflow-flowvault-java")
          echo "--- create response status: $status ---"
          cat /tmp/create.json
          if [ "$status" -ge 400 ]; then
            echo "::error::Repo creation failed with HTTP $status - the deploy credential likely lacks admin rights on Artifactory. An Artifactory admin needs to create 'skyflow-flowvault-java' manually."
            exit 1
          fi
          echo "Repo created successfully."

      - name: Already exists
        if: steps.check.outputs.status == '200'
        run: echo "skyflow-flowvault-java already exists - nothing to do."
