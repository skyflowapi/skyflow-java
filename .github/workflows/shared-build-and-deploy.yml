name: Shared Build and Deploy
on:
  workflow_call:
    inputs:
      ref:
        description: "Git reference to use (e.g., main or branch name)"
        required: true
        type: string

      server-id:
        description: "Id of the repository"
        required: true
        type: string

      profile:
        description: "Profile to pick from pom.xml"
        required: true
        type: string

      tag:
        description: 'Release Tag'
        required: true
        type: string

      module:
        description: 'Module to build and publish'
        required: false
        type: string
        default: ''

      version:
        description: >-
          Explicit version to release. Set by tag-triggered (beta/public)
          callers, which parse it out of a <module>/v<semver> tag - the raw
          tag text is not itself a usable Maven version. When empty, the
          version is derived as before (see the Bump Version step).
        required: false
        type: string
        default: ''

      release-branch:
        description: >-
          Branch that receives the version-bump commit, for beta/public
          releases. Supplied by the caller from the GitHub Release's
          target_commitish - i.e. the branch the human picked in the release
          UI. This used to be guessed by matching a branch tip to the tagged
          commit, which broke whenever the tip moved on (re-runs always
          failed) and silently picked an unrelated branch when several shared
          a tip. A tag records only a commit, never a branch, so the branch
          has to be supplied rather than inferred.
        required: false
        type: string
        default: ''

      dry-run:
        description: >-
          Validate the release pipeline WITHOUT publishing anything.
          Everything still runs - tag parsing, version resolution, the pom
          bump, the full build, tests and GPG signing - but 'mvn verify'
          replaces 'mvn deploy' (so the deploy plugin never runs at all,
          rather than being asked politely to skip) and the version-bump
          commit is not pushed. Publishing to Maven Central is immutable,
          so this is the only safe way to exercise the public path.
        required: false
        type: boolean
        default: false

    secrets:
      server-username:
        required: true

      server-password:
        required: true

      gpg-key:
        required: true

      gpg-passphrase:
        required: true

      skyflow-credentials:
        required: true

      test-expired-token:
        required: true

      test-reusable-token:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up maven or jfrog repository
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "adopt"
          server-id: ${{ inputs.server-id }}
          server-username: SERVER_USERNAME
          server-password: SERVER_PASSWORD
          gpg-private-key: ${{ secrets.gpg-key }} # Value of the GPG private key to import
          gpg-passphrase: GPG_PASSPHRASE # env variable for GPG private key passphrase

      - name: Validate release branch input
        if: ${{ inputs.tag == 'beta' || inputs.tag == 'public' }}
        run: |
          if [ -z "${{ inputs.release-branch }}" ]; then
            echo "::error::release-branch is required for ${{ inputs.tag }} releases."
            exit 1
          fi
          # The tagged commit must actually be on that branch, otherwise the
          # bump would land somewhere the release was never cut from.
          if ! git merge-base --is-ancestor HEAD "origin/${{ inputs.release-branch }}"; then
            echo "::error::Tagged commit is not an ancestor of origin/${{ inputs.release-branch }}."
            exit 1
          fi
          echo "Release branch: ${{ inputs.release-branch }}"

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1
        with:
          fallback: 1.0.0

      # Version resolution, in priority order:
      #   1. inputs.version - set by beta/public callers, which parse it out
      #      of a <module>/v<semver> tag (the tag text itself isn't a valid
      #      Maven version, so it can't be used directly).
      #   2. internal - reads the module's OWN committed pom. Git tags are a
      #      flat, repo-wide namespace with no module awareness, so a tag
      #      lookup cannot tell one module's version lineage from another's:
      #      it stamped a v3 tag (3.0.0-beta.13) onto both flowvault AND v2
      #      internal builds. A module's own pom is inherently per-module.
      #   3. Fallback - previoustag. Now unreachable in practice: all three
      #      callers either set inputs.version (release.yml, beta-release.yml)
      #      or are internal (internal-release.yml). Kept as a safety net.
      - name: Bump Version
        id: bump-version
        run: |
          chmod +x ./scripts/bump_version.sh ./scripts/current_module_version.sh
          if [ -n "${{ inputs.version }}" ]; then
            BASE_VERSION="${{ inputs.version }}"
          elif ${{ inputs.tag == 'internal' }}; then
            BASE_VERSION=$(./scripts/current_module_version.sh "${{ inputs.module }}")
          else
            BASE_VERSION="${{ steps.previoustag.outputs.tag }}"
          fi
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

          if ${{ inputs.tag == 'internal' }}; then
            ./scripts/bump_version.sh "$BASE_VERSION" "$(git rev-parse --short "$GITHUB_SHA")" "${{ inputs.module }}"
          else
            ./scripts/bump_version.sh "$BASE_VERSION" "" "${{ inputs.module }}"
          fi

      - name: Commit changes
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com

          if [[ "${{ inputs.tag }}" == "beta" || "${{ inputs.tag }}" == "public" ]]; then
            git checkout ${{ inputs.release-branch }}
          fi

          git add ${{ inputs.module }}/pom.xml

          # Nothing staged means the pom already held this version - the normal
          # case when someone correctly sets it before tagging. That is success,
          # not failure; a bare 'git commit' would exit 1 and abort the release.
          if git diff --cached --quiet; then
            echo "::notice::pom already at the target version - nothing to commit"
            exit 0
          fi

          if [[ "${{ inputs.tag }}" == "internal" ]]; then
            git commit -m "[AUTOMATED] Private Release ${{ steps.bump-version.outputs.base_version }}-dev-$(git rev-parse --short $GITHUB_SHA)"
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then
              echo "::notice::DRY RUN - not pushing the version-bump commit"
            else
              git push origin ${{ github.ref_name }} -f
            fi
          fi
          if [[ "${{ inputs.tag }}" == "beta" || "${{ inputs.tag }}" == "public" ]]; then
            git commit -m "[AUTOMATED] Public Release - ${{ steps.bump-version.outputs.base_version }}"
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then
              echo "::notice::DRY RUN - not pushing the version-bump commit"
            else
              git push origin ${{ inputs.release-branch }}
            fi
          fi

      - name: Create env
        id: create-env
        run: |
          touch .env
          echo SKYFLOW_CREDENTIALS=${{ secrets.skyflow-credentials }} >> .env
          echo TEST_EXPIRED_TOKEN=${{ secrets.test-expired-token }} >> .env
          echo TEST_REUSABLE_TOKEN=${{ secrets.test-reusable-token }} >> .env

      - name: Create credentials json
        id: create-json
        uses: jsdaniell/create-json@1.1.2
        with:
          name: "credentials.json"
          json: ${{ secrets.TEST_CREDENTIALS_FILE_STRING }}

      # Tests load these with Dotenv.load()/relative paths, which resolve
      # against the *module* directory - Maven runs each module's tests with
      # that module as the working dir. A repo-root .env was correct when this
      # was a single-module build, but since the common/v2/flowvault split it
      # leaves module tests unable to find their config. Discovered by glob so
      # this survives module renames/additions.
      - name: Distribute test config to modules
        run: |
          for module_pom in */pom.xml; do
            dir="$(dirname "$module_pom")"
            cp .env "$dir/.env"
            cp credentials.json "$dir/credentials.json"
            echo "seeded $dir/"
          done

      # 'verify' rather than 'deploy' for a dry run: the deploy plugin (and
      # the central-publishing extension bound to it) is never invoked at
      # all, so there is no upload path to accidentally leave enabled.
      # Everything up to and including packaging, tests and GPG signing
      # still runs, so this exercises the same build the real release would.
      - name: Publish package
        run: |
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            echo "::notice::DRY RUN - running 'verify' instead of 'deploy'; nothing will be published"
            if [[ "${{ inputs.tag }}" == "internal" ]]; then
              mvn --batch-mode -pl ${{ inputs.module }} -am verify -P jfrog -DskipTests
            else
              mvn --batch-mode -pl ${{ inputs.module }} -am verify -P ${{ inputs.profile }}
            fi
          elif [[ "${{ inputs.tag }}" == "internal" ]]; then
            mvn --batch-mode -pl ${{ inputs.module }} -am deploy -P jfrog -DskipTests
          elif [[ "${{ inputs.tag }}" == "beta" || "${{ inputs.tag }}" == "public" ]]; then
            mvn --batch-mode -pl ${{ inputs.module }} -am deploy -P ${{ inputs.profile }}
          fi

        env:
          SERVER_USERNAME: ${{ secrets.server-username }}
          SERVER_PASSWORD: ${{ secrets.server-password  }}
          GPG_PASSPHRASE: ${{ secrets.gpg-passphrase }}