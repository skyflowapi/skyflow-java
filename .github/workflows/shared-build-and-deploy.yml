name: Shared Build and Deploy
on:
  workflow_call:
    inputs:
      ref:
        description: "Git reference to use (e.g., main or branch name)"
        required: true
        type: string

      server-id:
        description: "Id of the repository"
        required: true
        type: string

      profile:
        description: "Profile to pick from pom.xml"
        required: true
        type: string

      tag:
        description: 'Release Tag'
        required: true
        type: string

      module:
        description: 'Module to build and publish'
        required: false
        type: string
        default: ''

      version:
        description: >-
          Explicit version to release. Set by tag-triggered (beta/public)
          callers, which parse it out of a <module>/v<semver> tag - the raw
          tag text is not itself a usable Maven version. When empty, the
          version is derived as before (see the Bump Version step).
        required: false
        type: string
        default: ''

    secrets:
      server-username:
        required: true

      server-password:
        required: true

      gpg-key:
        required: true

      gpg-passphrase:
        required: true

      skyflow-credentials:
        required: true

      test-expired-token:
        required: true

      test-reusable-token:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up maven or jfrog repository
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "adopt"
          server-id: ${{ inputs.server-id }}
          server-username: SERVER_USERNAME
          server-password: SERVER_PASSWORD
          gpg-private-key: ${{ secrets.gpg-key }} # Value of the GPG private key to import
          gpg-passphrase: GPG_PASSPHRASE # env variable for GPG private key passphrase

      - name: Resolve Branch for the Tagged Commit
        id: resolve-branch
        if: ${{ inputs.tag == 'beta' || inputs.tag == 'public' }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
          BRANCH_NAME=$(git for-each-ref --points-at="$TAG_COMMIT" --format='%(refname:short)' refs/remotes/origin | grep -v '/HEAD$' | sed 's#^origin/##' | head -n 1)
          if [ -z "$BRANCH_NAME" ]; then
            echo "Error: Could not resolve branch for the tag."
            exit 1
          fi
          echo "Resolved Branch Name: $BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1
        with:
          fallback: 1.0.0

      # Version resolution, in priority order:
      #   1. inputs.version - set by beta/public callers, which parse it out
      #      of a <module>/v<semver> tag (the tag text itself isn't a valid
      #      Maven version, so it can't be used directly).
      #   2. internal - reads the module's OWN committed pom. Git tags are a
      #      flat, repo-wide namespace with no module awareness, so a tag
      #      lookup cannot tell one module's version lineage from another's:
      #      it stamped a v3 tag (3.0.0-beta.13) onto both flowvault AND v2
      #      internal builds. A module's own pom is inherently per-module.
      #   3. Fallback - previoustag. Now unreachable in practice: all three
      #      callers either set inputs.version (release.yml, beta-release.yml)
      #      or are internal (internal-release.yml). Kept as a safety net.
      - name: Bump Version
        id: bump-version
        run: |
          chmod +x ./scripts/bump_version.sh ./scripts/current_module_version.sh
          if [ -n "${{ inputs.version }}" ]; then
            BASE_VERSION="${{ inputs.version }}"
          elif ${{ inputs.tag == 'internal' }}; then
            BASE_VERSION=$(./scripts/current_module_version.sh "${{ inputs.module }}")
          else
            BASE_VERSION="${{ steps.previoustag.outputs.tag }}"
          fi
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

          if ${{ inputs.tag == 'internal' }}; then
            ./scripts/bump_version.sh "$BASE_VERSION" "$(git rev-parse --short "$GITHUB_SHA")" "${{ inputs.module }}"
          else
            ./scripts/bump_version.sh "$BASE_VERSION" "" "${{ inputs.module }}"
          fi

      - name: Commit changes
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com

          if [[ "${{ inputs.tag }}" == "beta" || "${{ inputs.tag }}" == "public" ]]; then
            git checkout ${{ env.branch_name }}
          fi

          git add ${{ inputs.module }}/pom.xml
          if [[ "${{ inputs.tag }}" == "internal" ]]; then
            git commit -m "[AUTOMATED] Private Release ${{ steps.bump-version.outputs.base_version }}-dev-$(git rev-parse --short $GITHUB_SHA)"
            git push origin ${{ github.ref_name }} -f
          fi
          if [[ "${{ inputs.tag }}" == "beta" || "${{ inputs.tag }}" == "public" ]]; then
            git commit -m "[AUTOMATED] Public Release - ${{ steps.bump-version.outputs.base_version }}"
            git push origin ${{ env.branch_name }}
          fi

      - name: Create env
        id: create-env
        run: |
          touch .env
          echo SKYFLOW_CREDENTIALS=${{ secrets.skyflow-credentials }} >> .env
          echo TEST_EXPIRED_TOKEN=${{ secrets.test-expired-token }} >> .env
          echo TEST_REUSABLE_TOKEN=${{ secrets.test-reusable-token }} >> .env

      - name: Create credentials json
        id: create-json
        uses: jsdaniell/create-json@1.1.2
        with:
          name: "credentials.json"
          json: ${{ secrets.TEST_CREDENTIALS_FILE_STRING }}

      - name: Publish package
        run: |
          if [[ "${{ inputs.tag }}" == "internal" ]]; then
            mvn --batch-mode -pl ${{ inputs.module }} -am deploy -P jfrog -DskipTests
          elif [[ "${{ inputs.tag }}" == "beta" || "${{ inputs.tag }}" == "public" ]]; then
            mvn --batch-mode -pl ${{ inputs.module }} -am deploy -P ${{ inputs.profile }}
          fi

        env:
          SERVER_USERNAME: ${{ secrets.server-username }}
          SERVER_PASSWORD: ${{ secrets.server-password  }}
          GPG_PASSPHRASE: ${{ secrets.gpg-passphrase }}