name: "CodeQL"

on:
  push:
    branches: [ main, '*' ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    defaults:
      run:
        working-directory: ./

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          path: ./

    # Pin the JDK Autobuild uses instead of the runner image default (JDK 17 on ubuntu-latest).
    # Matches pr.yml. SK-3332.
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: JDK evidence and Java4Shell guard (CVE-2026-114938)
      run: bash scripts/check-jdk-java4shell.sh

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

    - name: Upload SARIF Results
      uses: actions/upload-artifact@v2
      with:
        name: sarif-results
        path: /home/runner/work/skyflow-java/results/java.sarif
